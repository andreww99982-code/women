name: Android CI/CD (Auto-Generate Key & Sign AAB)

on:
  push:
    branches: [ "main" ] # Сработает при пуше в ветку main
  workflow_dispatch: # Позволяет запустить агент вручную кнопкой в GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: 8.7
        cache-disabled: true

    - name: Check keystore password
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      run: |
        if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
          {
            echo "## Нужно добавить пароль для подписи AAB"
            echo ""
            echo "1. Откройте репозиторий на GitHub."
            echo "2. Перейдите в **Settings → Secrets and variables → Actions**."
            echo "3. Нажмите **New repository secret**."
            echo "4. В поле **Name** укажите: \`KEYSTORE_PASSWORD\`."
            echo "5. В поле **Secret** укажите пароль длиной минимум 6 символов."
            echo "6. Нажмите **Add secret** и перезапустите workflow."
            echo ""
            echo "Сохраните этот пароль у себя: он используется как store password и key password для файла \`release-key.jks\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=KEYSTORE_PASSWORD не задан::Добавьте repository secret KEYSTORE_PASSWORD: Settings → Secrets and variables → Actions → New repository secret. Пароль должен быть минимум 6 символов."
          exit 1
        fi

        if [ "${#KEYSTORE_PASSWORD}" -lt 6 ]; then
          {
            echo "## Пароль KEYSTORE_PASSWORD слишком короткий"
            echo ""
            echo "Android keytool требует пароль длиной минимум 6 символов."
            echo "Обновите secret \`KEYSTORE_PASSWORD\`: **Settings → Secrets and variables → Actions → Repository secrets → KEYSTORE_PASSWORD → Update**."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=KEYSTORE_PASSWORD слишком короткий::Пароль должен быть минимум 6 символов. Обновите secret KEYSTORE_PASSWORD в Settings → Secrets and variables → Actions."
          exit 1
        fi

    # 1. Генерируем новый Keystore-файл прямо на лету в агенте
    # Внимание: для реального продакшена RuStore этот файл нужно будет сохранить,
    # иначе при следующем запуске ключ будет другим, и обновление в RuStore не пройдёт.
    # Пароль keystore берётся из GitHub Actions Secret (Settings -> Secrets and variables ->
    # Actions -> New repository secret -> KEYSTORE_PASSWORD), а не хранится в коде workflow.
    - name: Generate New Keystore
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      run: |
        keytool -genkeypair \
          -v \
          -keystore release-key.jks \
          -alias my-key-alias \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass "$KEYSTORE_PASSWORD" \
          -keypass "$KEYSTORE_PASSWORD" \
          -dname "CN=MyCompany, OU=Dev, O=MyCompany, L=Moscow, S=Russia, C=RU"

    # 2. Собираем и подписываем AAB сгенерированным ключом
    - name: Build and Sign AAB
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      run: |
        STORE_PROP="android.injected.signing.store.password"
        KEY_PROP="android.injected.signing.key.password"
        gradle bundleRelease \
          -Pandroid.injected.signing.store.file=release-key.jks \
          -P"$STORE_PROP"="$KEYSTORE_PASSWORD" \
          -Pandroid.injected.signing.key.alias=my-key-alias \
          -P"$KEY_PROP"="$KEYSTORE_PASSWORD"

    # 3. Сохраняем подписанный AAB и САМ КЛЮЧ в артефакты (чтобы вы могли его скачать и не потерять)
    - name: Upload Artifacts (AAB and Keystore)
      uses: actions/upload-artifact@v7
      with:
        name: signed-android-assets
        path: |
          app/build/outputs/bundle/release/*.aab
          release-key.jks
